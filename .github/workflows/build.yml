name: Build

on:
  push:
    branches: [ main ]
    paths:
      - 'stm32cgen.py'
      - 'stm32cmsis.py'
      - 'tests/**'
      - 'EXAMPLES/**'
      - '.github/workflows/build.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'stm32cgen.py'
      - 'stm32cmsis.py'
      - 'tests/**'
      - 'EXAMPLES/**'
      - '.github/workflows/build.yml'
      - 'pyproject.toml'
      - 'requirements*.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7

    - name: Cache ARM GCC toolchain
      id: cache-toolchain
      uses: actions/cache@v6
      with:
        path: /home/runner/arm-gcc-toolchain
        key: arm-gcc-9-2020-q2-update

    - name: Install ARM GCC toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y xz-utils wget
        mkdir -p /home/runner/arm-gcc-toolchain
        wget -qO- "https://developer.arm.com/-/media/Files/downloads/gnu-rm/9-2020q2/gcc-arm-none-eabi-9-2020-q2-update-x86_64-linux.tar.bz2" \
          | tar -xjf - -C /home/runner/arm-gcc-toolchain --strip=1

    - name: Add toolchain to PATH
      run: echo "/home/runner/arm-gcc-toolchain/bin" >> $GITHUB_PATH

    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-requests

    - name: Install dependencies
      run: pip install requests

    - name: Prepare example cache dirs
      run: |
        for d in f030f4 f103c8 f303vc f401cc f407vg f446re g031f8 g070rb g431cb l152rb; do
          mkdir -p "EXAMPLES/${d}_demo/inc" "EXAMPLES/${d}_demo/src"
        done

    - name: Cache CMSIS downloads
      uses: actions/cache@v6
      with:
        path: |
          EXAMPLES/*_demo/inc
          EXAMPLES/*_demo/src/startup_*.s
          EXAMPLES/*_demo/src/system_*.c
        key: cmsis-${{ runner.os }}-${{ hashFiles('EXAMPLES/*.sh') }}

    - name: Build examples
      working-directory: EXAMPLES
      shell: bash
      run: |
        set -uo pipefail
        demos=(f030f4_demo f103c8_demo f303vc_demo f401cc_demo f407vg_demo
               f446re_demo g031f8_demo g070rb_demo g431cb_demo l152rb_demo)
        logs="${RUNNER_TEMP}/example-logs"
        mkdir -p "$logs"
        failed=0
        for demo in "${demos[@]}"; do
          log="$logs/${demo}.log"
          echo "::group::${demo}"
          if printf '\n' | timeout 10m bash "${demo}.sh" >"$log" 2>&1; then
            echo "PASS ${demo}"
          else
            failed=1
            echo "FAIL ${demo}"
            grep -n -i 'error:' "$log" | tail -20 || true
            echo "::error title=${demo} failed::$(grep -m1 -i 'error:' "$log" | cut -c1-200 || echo 'see log')"
          fi
          echo "::endgroup::"
        done
        [ "$failed" -eq 0 ]

    - name: Upload firmware
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: examples-firmware
        path: |
          EXAMPLES/*_demo/_build/Project.bin
          EXAMPLES/*_demo/_build/Project.hex
        if-no-files-found: warn
        retention-days: 14

    - name: Upload example logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: examples-logs
        path: ${{ runner.temp }}/example-logs/*.log
        if-no-files-found: warn
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Cache pip
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-test

    - name: Cache CMSIS headers
      uses: actions/cache@v6
      with:
        path: tests/fixtures/cache
        key: ${{ runner.os }}-cmsis-header-cache

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest pytest-cov ruff

    - name: Lint
      run: ruff check stm32cgen.py stm32cmsis.py tests/

    - name: Run tests
      run: python -m pytest tests/ --tb=short
